### model
model_name_or_path: /root/lnj/models/SpatialLM-Qwen3-1.7B-init
trust_remote_code: true
train_from_scratch: false

### method
do_train: true
freeze_language_tower: false
freeze_point_tower: false
train_proj_only: false
flash_attn: fa2

### dataset
dataset: floodnet_train,ladi_train,aircop_real2_train,aircop_sim_train,urbanvideo_train,nescene_train
dataset_dir: data
template: spatiallm_qwen3
num_bins: 1280
do_color_augmentation: false
do_transform_augmentation: true
random_rotation: true
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: /root/lnj/SpatialLM/saves/vqa_train_part_data
logging_steps: 50
save_steps: 1000
save_total_limit: 3
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
fp16: false
tf32: true
ddp_timeout: 180000000
max_new_tokens: 4096

### eval
val_size: 0.01
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 1000
