# SpatialLM GRPO —— UrbanVideoBench（4080 条 / 1159 个点云 / 119 GB）
# 环境: /home/aiscuser/miniconda3/envs/spatiallm-grpo
#
# ⚠ 显存现状（实测）：本配置**单卡可跑，8 卡会 OOM**。
#   启动（单卡，已验证）:
#     cd /home/aiscuser/nyp/3D-RL && CUDA_VISIBLE_DEVICES=0 \
#       PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       python grpo/train_grpo.py --config grpo/config_urbanvideo.yaml
#   原因：静态占用爬坡到约 21.7GB（权重+ref+梯度+优化器状态）后，UrbanVideo 的
#   点云编码器激活尖峰还要十几 GB，8 卡再叠 DDP 的梯度桶/通信缓冲就顶穿 40GB。
#   已试过无效的办法：降 max_points(65536→16384)、降 G(8→6→4)、8bit 优化器、
#   梯度检查点 —— 峰值都稳在 38GB 附近。要上多卡得先真正砍掉编码器激活
#   （例如冻结点云塔或让它走 bf16），那是另一件事，没做。
#
# 与 AirCop 的两个关键差异：
#   1) 答案字母到 G（A-G 全都出现），reward.py 的 CHOICES 已放宽到 A-H
#   2) 点云单文件中位数 125MB，是 AirCop 的 30 倍 -> 读盘/预处理是瓶颈

### 模型
model_path: /home/aiscuser/nyp/ckpts/point_mixed_downsample
dtype: bfloat16

### 数据（A-G 选择题；reward 规则同 AirCop：答对=1，答错或格式崩=0）
train_json: data/UrbanVideoBench/MCQ_EmbodiedCity_AerialVLN.json
max_samples: null
num_bins: 1280
# 体素下采样后的点数上限（0=不限）。实测本数据集 n=48 抽样：
#   p25 13.0k / p50 26.2k / p75 40.5k / p90 59.1k / max 104k（另一次抽样见过 22 万）
# 点数直接决定 Sonata(fp32) 的注意力显存：5.5万点时前向+反向 14.3GB，
# 22 万点会把 40G 卡打爆。65536 只影响约 6% 的文件，对它们做均匀随机下采样。
max_points: 65536

### GRPO 采样
num_generations: 8         # 选项多到 G，随机基线只有 ~1/6，组内更容易有方差
max_new_tokens: 8
temperature: 1.0
top_p: 1.0
top_k: 0

### GRPO 目标
kl_coef: 0.04
clip_eps: 0.2
num_iterations: 1

### 训练（8 卡：有效 batch = 8 x 2 x 2 = 32 个 prompt = 256 条 rollout）
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
logp_batch_size: 4         # 一次前向算几条序列的 logprob；0=整组一次算完。实测 G=8 一次算完峰值 37GB/40GB 太贴边
pcd_cache_size: 64         # 缓存的是预处理后的张量：max_points 封顶后单条仅 ~2.4MB
                           #（125MB 是原始 ply 的大小，不是缓存占用），可以放宽
learning_rate: 1.0e-6
num_train_epochs: 1
warmup_ratio: 0.03
lr_scheduler_type: constant
gradient_checkpointing: false
dataloader_num_workers: 4
seed: 42

### 边下边训（数据已全量落盘，默认关闭；磁盘吃紧时改 true 即可）
# 参数按实测文件大小配：本数据集 1159 个 ply，均值 104.7MB / p50 124.8MB / 合计 118.5GB。
# window=24 -> 单窗口约 2.5GB，磁盘峰值 ≈ (release_lag+2) × 2.5GB ≈ 10GB，而不是 118.5GB。
stream_from_blob: false
pcd_local_root: /home/aiscuser/nyp/pcdata
stream_window_files: 24    # 每个窗口多少个点云文件（越大越接近全局 shuffle）
stream_prefetch: true      # 后台预取下一个窗口，把下载时间藏在训练时间里
stream_delete_after: true  # 窗口训完删本地文件（只删本进程下载的，见 blob_stream.py）
stream_release_lag: 2      # 滞后几个窗口再删

### 输出/日志
output_dir: /home/aiscuser/nyp/saves/grpo_urbanvideo
logging_steps: 1
save_steps: 100
# 单卡 4080/4 = 1020 步/epoch，save_steps=100 会产生 10 个中间点。
# 原来设 3 会只留最后 3 个 —— 但 AirCop 实测 accuracy 峰值在前 1/5（对应这里约
# 第 200 步），之后一路回落。留 3 个等于恰好把最该要的早期 ckpt 删光。
# 全留：10 × 11GB = 110GB，磁盘 4.8T 余量足够。
save_total_limit: 12
report_to: wandb
wandb_project: spatiallm-grpo
run_name: urbanvideo-g8-lr1e6
